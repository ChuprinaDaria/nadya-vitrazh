[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nadya-vitrazh"
version = "0.1.0"
description = "Interactive stained-glass art installation — person detection + pose classification + motor control"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8",
    "ultralytics>=8.0",
    "mediapipe>=0.10",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.104", "uvicorn>=0.24", "websockets>=12.0"]
dev = ["pytest>=7.4", "mypy>=1.7"]
gpio = ["RPi.GPIO>=0.7"]

[tool.setuptools.packages.find]
include = ["vitrazh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
